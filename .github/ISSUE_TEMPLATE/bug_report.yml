name: Bug Report
description: Report a problem with windows-url-monitor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as many fields as possible.

  - type: input
    id: version
    attributes:
      label: Script version
      description: "Found in `windows-url-monitor.psd1` -> `ModuleVersion`"
      placeholder: "e.g. 1.1.1"
    validations:
      required: true

  - type: input
    id: ps-version
    attributes:
      label: PowerShell version
      description: "Output of `$PSVersionTable.PSVersion`"
      placeholder: "e.g. 5.1.19041.4648"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: "Windows build or distro name"
      placeholder: "e.g. Windows 11 23H2 (22631)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Minimal, numbered steps that reproduce the issue"
      placeholder: |
        1. Set `$env:MONITOR_URL = "example.com"`
        2. Run `.\Monitor-WebsiteAvailability.ps1`
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: "Paste the relevant lines from `monitor.log` or the terminal"
      render: text
