name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: "What limitation or gap does this feature address?"
      placeholder: "e.g. When the script detects a down site, it always sends an email even if the outage was only 1 second…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "Describe the behaviour you'd like to see"
      placeholder: "e.g. Add a `-MinDowntimeSeconds` parameter so alerts are only sent after the site has been unreachable for N seconds…"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Connectivity check
        - Email / SMTP
        - Logging
        - Configuration / parameters
        - Task Scheduler integration
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Any other approaches you thought of?"
