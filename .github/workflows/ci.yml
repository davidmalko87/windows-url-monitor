name: CI

on:
  push:
    branches: [Prod]
  pull_request:
    branches: [Prod]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity @('Error', 'Warning')
          if ($results) {
            $results | Format-Table -Property RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "PSScriptAnalyzer reported $($results.Count) issue(s). See table above."
          }
          Write-Host "No PSScriptAnalyzer issues found." -ForegroundColor Green

  syntax:
    name: Syntax check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'Monitor-WebsiteAvailability.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Syntax errors found in Monitor-WebsiteAvailability.ps1"
          }
          Write-Host "Syntax OK" -ForegroundColor Green
